<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.wrap{position:relative;overflow:hidden}
.tile{position:absolute;background:linear-gradient(160deg,#1c1530 0%,#0e0b16 100%)}
.mac .tile{box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.06)}
svg.mark{position:absolute}
</style></head><body>
<div class="wrap" id="w"><div class="tile" id="t"></div>
<svg class="mark" id="m" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
 <g transform="matrix(1,0,0,1,-104.285,0)"><g transform="matrix(1,0,0,1,80.2853,0)"><g transform="matrix(1.20193,0,0,1.20193,22.7763,-2.42319)">
  <path id="p" fill="url(#g)" d="M10.004,12.998L1.067,12.998C1.035,12.67 1.018,12.337 1.018,12C1.018,11.663 1.035,11.33 1.067,11.002L8.593,11.002L3.273,5.682C3.696,5.166 4.169,4.693 4.684,4.271L10.004,9.591L10.004,2.065C10.332,2.033 10.665,2.016 11.002,2.016C11.339,2.016 11.672,2.033 12,2.065L12,11.002L20.937,11.002C20.969,11.33 20.986,11.663 20.986,12C20.986,12.337 20.969,12.67 20.937,12.998L13.411,12.998L18.731,18.318C18.309,18.834 17.836,19.307 17.32,19.729L12,14.409L12,21.935C11.672,21.967 11.339,21.984 11.002,21.984C10.665,21.984 10.332,21.967 10.004,21.935L10.004,12.998Z"/>
 </g></g></g></svg></div>
<script>
// ?size=1024&tile=mac|full|none&mark=0.5&color=grad|white|black|purple
const q = new URLSearchParams(location.search);
const S = +q.get("size") || 1024, tile = q.get("tile") || "mac", mark = +q.get("mark") || 0.5, color = q.get("color") || "grad";
const w = document.getElementById("w"), t = document.getElementById("t"), m = document.getElementById("m"), p = document.getElementById("p");
w.style.width = w.style.height = S + "px";
if (tile === "mac") { document.body.classList.add("mac"); const pad = S * 100 / 1024, sz = S - 2 * pad; Object.assign(t.style, { left: pad + "px", top: pad + "px", width: sz + "px", height: sz + "px", borderRadius: sz * 0.2245 + "px" }); }
else if (tile === "full") Object.assign(t.style, { left: 0, top: 0, width: S + "px", height: S + "px" });
else if (tile === "round") Object.assign(t.style, { left: 0, top: 0, width: S + "px", height: S + "px", borderRadius: S * 0.22 + "px" });
else t.style.display = "none";
if (tile === "mac") document.body.classList.add("mac");
const ms = S * mark; Object.assign(m.style, { width: ms + "px", height: ms + "px", left: (S - ms) / 2 + "px", top: (S - ms) / 2 + "px" });
if (color === "white") p.setAttribute("fill", "#ffffff");
if (color === "black") p.setAttribute("fill", "#000000");
</script></body></html>
