<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
 background:linear-gradient(160deg,#1d2433 0%,#0f1218 100%);box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.06)}
svg{position:absolute;left:100px;top:100px}

<svg width="824" height="824" viewBox="0 0 824 824">

 <!-- mosaic tiles behind the lens -->
 <rect x="170" y="170" width="200" height="200" rx="34" fill="#2a3550"/>
 <rect x="400" y="170" width="200" height="200" rx="34" fill="#243049"/>

 <!-- scout lens -->
 <circle cx="455" cy="455" r="150" fill="none" stroke="url(#g)" stroke-width="56"/>
 <line x1="565" y1="565" x2="670" y2="670" stroke="url(#g)" stroke-width="64" stroke-linecap="round"/>
 <circle cx="455" cy="455" r="38" fill="#9fbcff"/>
</svg></body></html>
