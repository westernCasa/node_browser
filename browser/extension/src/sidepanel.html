<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NODE</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div>
        <p class="kicker">Next pages</p>
        <h1>Suggestions</h1>
      </div>
      <div class="rail-actions">
        <button class="chip active" id="tab-suggest">Suggest</button>
        <button class="chip" id="tab-talk">Talk</button>
        <button class="chip" id="tab-settings">Settings</button>
      </div>
    </div>
    <section id="suggest-pane">
      <div class="keys" id="keys"></div>
      <div class="status" id="suggest-status"></div>
      <div id="results"></div>
    </section>
    <section id="talk-pane" hidden>
      <p class="help">Opening Talk sends this page's address to Hacker News search and Bluesky search.</p>
      <div id="talk-status" class="state"></div>
      <div id="talk-list"></div>
    </section>
    <section id="settings-pane" hidden>
      <div class="source">
        <label class="field"><span>Brave Search API key</span><input type="password" id="brave-key" /></label>
        <p class="help">Without a key, web results come from DuckDuckGo.</p>
        <button class="chip wide" id="save-settings">Save</button>
      </div>
      <p class="help" id="playback-line"></p>
    </section>
  </aside>
  <script src="sidepanel.js"></script>
</body>
</html>
