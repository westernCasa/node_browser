name: Bug report
description: Something in NODE broke or did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The fastest way to report a bug is Help → Report a Problem inside NODE. It copies diagnostics and opens this form.
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows
        - Mac with Apple chip
        - Mac with Intel chip
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NODE version
      description: Settings → Help shows the version.
      placeholder: "0.9.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open ...
        2. Click ...
  - type: dropdown
    id: blocking
    attributes:
      label: Did it stop you from finishing what you were doing?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Help → Copy diagnostics, then paste here.
      render: text
