# Deploys the NODE share server (worker/) to Cloudflare. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (a token with "Workers Scripts: Edit" and
# "Workers R2 Storage: Edit") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy share server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

concurrency: deploy-share

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Test the Worker
        run: node test/share-worker-demo.js
      - name: Create the bucket (first run only)
        working-directory: worker
        run: npx --yes wrangler@4 r2 bucket create node-share-trails || echo "Bucket exists."
      - name: Delete trails after 30 days
        working-directory: worker
        run: npx --yes wrangler@4 r2 bucket lifecycle add node-share-trails expire-after-30-days t/ --expire-days 30 --force || echo "::warning::Could not set the 30-day rule. The Worker still refuses trails older than 30 days; set the rule in the Cloudflare dashboard (R2 → node-share-trails → Settings → Object lifecycle rules)."
      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
