# Builds the installers and publishes a GitHub release when a version tag is
# pushed (for example: git tag v1.0.0 && git push origin v1.0.0). Installed
# copies of NODE find the new release through the automatic updater.
#
# Signing is optional and switches on when these repository secrets exist:
#   macOS:   CSC_LINK (Developer ID Application .p12, base64), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
# Without them the builds are unsigned: macOS shows a warning on first open and
# cannot install updates by itself; Windows SmartScreen warns once.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the release once, before the three builds upload to it, so they
  # never race to create duplicate releases.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes for testers: docs/release-notes/<tag>.md when it exists.
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --notes "Installers for this version are being built. They appear here in about 20 minutes."; fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "NODE ${GITHUB_REF_NAME#v} (beta)" "$@"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        if: runner.os == 'Linux'
        run: npm run test:unit
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # No certificate: build unsigned instead of failing.
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD
            # Without a certificate the Mac app is ad-hoc signed: unsigned apps
            # on Apple chips report "damaged"; ad-hoc ones get the normal
            # "Open Anyway" prompt in Privacy & Security.
            if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-c.mac.identity=-"; fi
          fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npx electron-builder --publish always $EXTRA
