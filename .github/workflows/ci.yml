# Tests on every push and pull request to main.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright for the end-to-end tests
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: End-to-end tests
        run: |
          set +e +o pipefail
          (cd test/e2e/site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          mkdir -p e2e-out
          for t in 01-basics 03-rules-and-fast-results 04-find-zoom-history 05-research-session 09-playback-limit 12-pip-bookmarks-adblock 13-ask-ai 15-agents-mcp 16-research-agent 17-talk 18-redteam 19-browser-basics 20-first-run-and-help 21-rules-editor 22-ui-refresh 23-beta-survey 24-mosaic-pick 25-video-loop 26-gestures-tour 27-privacy-visible 28-ask-across-tabs 29-blocker-onpage 30-tab-focus-sleep 31-passwords 32-passwords-more 33-sidebar-chrome 34-command-bar 35-frames-tabs 36-trail-tabs 37-threads; do
            echo "::group::$t"
            xvfb-run -a node test/e2e/$t.js "$PWD/e2e-out" 2>&1 | tee e2e-out/$t.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$status" != "0" ]; then
              # Failed checks and the last lines as annotations, readable without the full log.
              grep -E "✗|ERROR|Error" e2e-out/$t.log | head -8 | while IFS= read -r l; do echo "::error title=$t::$l"; done
              echo "::error title=$t (end)::$(tail -3 e2e-out/$t.log | tr '\n' ' ')"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-out/**/*.png

  # Most beta testers are on Windows: run the unit tests and the core
  # end-to-end suites there too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright for the end-to-end tests
        run: npm install --no-save playwright@1.56.0
      - name: End-to-end tests
        shell: bash
        run: |
          set +e +o pipefail
          (cd test/e2e/site && python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p e2e-out
          for t in 01-basics 05-research-session 19-browser-basics 20-first-run-and-help 22-ui-refresh 23-beta-survey 24-mosaic-pick 25-video-loop 26-gestures-tour 27-privacy-visible 28-ask-across-tabs 29-blocker-onpage 30-tab-focus-sleep 31-passwords 32-passwords-more 33-sidebar-chrome 34-command-bar 35-frames-tabs 36-trail-tabs 37-threads; do
            echo "::group::$t"
            node test/e2e/$t.js "$PWD/e2e-out" 2>&1 | tee e2e-out/$t.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$status" != "0" ]; then
              # Failed checks and the last lines as annotations, readable without the full log.
              grep -E "✗|ERROR|Error" e2e-out/$t.log | head -8 | while IFS= read -r l; do echo "::error title=$t::$l"; done
              echo "::error title=$t (end)::$(tail -3 e2e-out/$t.log | tr '\n' ' ')"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-windows
          path: e2e-out/**/*.png
