<!doctype html><html><head><meta charset="utf-8"><style>
/* README images in the NODE brand (guideline v1): black ground, ink type,
   Barlow uppercase headings, flat white mark, thin flat frame, no gradients.
   make-frames.js loads this with ?img=raw/<name>.png&hero=1 and saves #stage. */
@font-face{font-family:"Barlow";font-weight:400;src:url("../../../renderer/fonts/barlow-latin-400-normal.woff2")}
@font-face{font-family:"Barlow";font-weight:600;src:url("../../../renderer/fonts/barlow-latin-600-normal.woff2")}
@font-face{font-family:"Barlow";font-weight:700;src:url("../../../renderer/fonts/barlow-latin-700-normal.woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url("../../../renderer/fonts/jetbrains-mono-latin-400-normal.woff2")}
:root{--surface:#000;--line:#2a2a2d;--ink:#fff;--ink-muted:#a1a1a6}
body{margin:0;background:#000}
#stage{width:1600px;padding:64px 64px 64px;box-sizing:border-box;background:var(--surface);font-family:"Barlow",sans-serif;color:var(--ink)}
.head{display:flex;align-items:center;gap:22px;margin-bottom:40px}
.mark{width:52px;height:52px;fill:var(--ink);flex:none}
.eyebrow{margin:0 0 6px;font:600 13px/16px "Barlow";letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
h1{margin:0;font:700 40px/44px "Barlow";letter-spacing:.04em;text-transform:uppercase}
.tag{margin:10px 0 0;font:400 18px/26px "Barlow";color:var(--ink-muted)}
.win{border:1px solid var(--line)}
.win img{display:block;width:100%}
body:not(.hero) .head{display:none}
body:not(.hero) #stage{padding:40px}
</style></head><body>
<div id="stage">
  <div class="head"><svg class="mark" viewBox="22.8 -0.2 24 24" aria-hidden="true"><path transform="matrix(1.20193,0,0,1.20193,22.7763,-2.42319)" d="M10.004,12.998L1.067,12.998C1.035,12.67 1.018,12.337 1.018,12C1.018,11.663 1.035,11.33 1.067,11.002L8.593,11.002L3.273,5.682C3.696,5.166 4.169,4.693 4.684,4.271L10.004,9.591L10.004,2.065C10.332,2.033 10.665,2.016 11.002,2.016C11.339,2.016 11.672,2.033 12,2.065L12,11.002L20.937,11.002C20.969,11.33 20.986,11.663 20.986,12C20.986,12.337 20.969,12.67 20.937,12.998L13.411,12.998L18.731,18.318C18.309,18.834 17.836,19.307 17.32,19.729L12,14.409L12,21.935C11.672,21.967 11.339,21.984 11.002,21.984C10.665,21.984 10.332,21.967 10.004,21.935L10.004,12.998Z"/></svg><div><p class="eyebrow">Research browser · 0.4</p><h1>NODE</h1><p class="tag">Suggestions from the page you are reading. Media in up to four tabs at once.</p></div></div>
  <div class="win"><img id="shot" alt=""></div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("shot").src = q.get("img");
if (q.get("hero")) document.body.classList.add("hero");
</script></body></html>
