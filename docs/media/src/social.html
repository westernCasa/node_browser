<!doctype html><html><head><meta charset="utf-8"><style>
/* 16:9 social images (1600x900) for posts on X. make-social.js loads this with
   ?img=raw/<name>.png&title=...&sub=... and saves #stage. */
:root{--bg1:#1c1530;--bg2:#0e0b16;--violet:#8b5cf6;--lav:#c4b5fd}
body{margin:0}
#stage{width:1600px;height:900px;box-sizing:border-box;padding:48px 72px 0;overflow:hidden;background:radial-gradient(1200px 600px at 15% 0%,#2a1d4d 0%,var(--bg1) 45%,var(--bg2) 100%);font-family:-apple-system,"Inter","Segoe UI",sans-serif;color:#fff;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.mark{flex:none;width:60px;height:60px;border-radius:15px;background:linear-gradient(145deg,var(--violet),#6d28d9);display:grid;place-items:center;box-shadow:0 8px 30px rgba(139,92,246,.45)}
.mark svg{width:36px;height:36px;fill:#fff}
h1{margin:0;font-size:42px;font-weight:800;letter-spacing:.01em}
.sub{margin:4px 0 0;font-size:21px;color:var(--lav)}
.win{flex:1;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.bar{height:32px;background:#232027;display:flex;align-items:center;gap:8px;padding:0 14px}
.bar i{width:12px;height:12px;border-radius:50%;display:block}
.win img{display:block;width:100%}
</style></head><body>
<div id="stage">
  <div class="head">
    <div class="mark"><svg viewBox="22.8 -0.2 24 24"><path transform="matrix(1.20193,0,0,1.20193,22.7763,-2.42319)" d="M10.004,12.998L1.067,12.998C1.035,12.67 1.018,12.337 1.018,12C1.018,11.663 1.035,11.33 1.067,11.002L8.593,11.002L3.273,5.682C3.696,5.166 4.169,4.693 4.684,4.271L10.004,9.591L10.004,2.065C10.332,2.033 10.665,2.016 11.002,2.016C11.339,2.016 11.672,2.033 12,2.065L12,11.002L20.937,11.002C20.969,11.33 20.986,11.663 20.986,12C20.986,12.337 20.969,12.67 20.937,12.998L13.411,12.998L18.731,18.318C18.309,18.834 17.836,19.307 17.32,19.729L12,14.409L12,21.935C11.672,21.967 11.339,21.984 11.002,21.984C10.665,21.984 10.332,21.967 10.004,21.935L10.004,12.998Z"/></svg></div>
    <div><h1 id="t"></h1><p class="sub" id="s"></p></div>
  </div>
  <div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><img id="shot" alt=""></div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("shot").src = q.get("img");
document.getElementById("t").textContent = q.get("title");
document.getElementById("s").textContent = q.get("sub");
</script></body></html>
