<!doctype html><html><head><meta charset="utf-8"><style>
/* 16:9 images for X (1600x900) in the NODE brand: black ground, uppercase
   Barlow headline bottom-left of the text block, flat white mark, thin frame.
   make-social.js loads this with ?img=raw/<name>.png&title=...&sub=... */
@font-face{font-family:"Barlow";font-weight:400;src:url("../../../renderer/fonts/barlow-latin-400-normal.woff2")}
@font-face{font-family:"Barlow";font-weight:600;src:url("../../../renderer/fonts/barlow-latin-600-normal.woff2")}
@font-face{font-family:"Barlow";font-weight:700;src:url("../../../renderer/fonts/barlow-latin-700-normal.woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url("../../../renderer/fonts/jetbrains-mono-latin-400-normal.woff2")}
:root{--surface:#000;--line:#2a2a2d;--ink:#fff;--ink-muted:#a1a1a6}
body{margin:0}
#stage{width:1600px;height:900px;box-sizing:border-box;padding:56px 64px 0;overflow:hidden;background:var(--surface);font-family:"Barlow",sans-serif;color:var(--ink);display:flex;flex-direction:column}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:36px}
.mark{width:44px;height:44px;fill:var(--ink);flex:none;margin-bottom:6px}
.eyebrow{margin:0 0 8px;font:600 13px/16px "Barlow";letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
h1{margin:0;font:700 44px/48px "Barlow";letter-spacing:.04em;text-transform:uppercase}
.sub{margin:10px 0 0;font:400 20px/28px "Barlow";color:var(--ink-muted);max-width:1100px}
.win{flex:1;border:1px solid var(--line);border-bottom:0;overflow:hidden}
.win img{display:block;width:100%}
</style></head><body>
<div id="stage">
  <div class="head"><div><p class="eyebrow">NODE · research browser</p><h1 id="t"></h1><p class="sub" id="s"></p></div><svg class="mark" viewBox="22.8 -0.2 24 24" aria-hidden="true"><path transform="matrix(1.20193,0,0,1.20193,22.7763,-2.42319)" d="M10.004,12.998L1.067,12.998C1.035,12.67 1.018,12.337 1.018,12C1.018,11.663 1.035,11.33 1.067,11.002L8.593,11.002L3.273,5.682C3.696,5.166 4.169,4.693 4.684,4.271L10.004,9.591L10.004,2.065C10.332,2.033 10.665,2.016 11.002,2.016C11.339,2.016 11.672,2.033 12,2.065L12,11.002L20.937,11.002C20.969,11.33 20.986,11.663 20.986,12C20.986,12.337 20.969,12.67 20.937,12.998L13.411,12.998L18.731,18.318C18.309,18.834 17.836,19.307 17.32,19.729L12,14.409L12,21.935C11.672,21.967 11.339,21.984 11.002,21.984C10.665,21.984 10.332,21.967 10.004,21.935L10.004,12.998Z"/></svg></div>
  <div class="win"><img id="shot" alt=""></div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("shot").src = q.get("img");
document.getElementById("t").textContent = q.get("title");
document.getElementById("s").textContent = q.get("sub");
</script></body></html>
