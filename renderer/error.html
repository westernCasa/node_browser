<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:" />
    <title>Page not loaded</title>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 400; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 16px/24px "Barlow", "Helvetica Neue", Arial, sans-serif; }
      .card { max-width: 520px; margin: 16px; padding: 40px; border: 1px solid #2a2a2d; }
      .eyebrow { margin: 0 0 8px; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #a1a1a6; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      p { margin: 0 0 16px; color: #a1a1a6; }
      .url, .code { font: 13px/20px "JetBrains Mono", ui-monospace, Menlo, monospace; color: #fff; word-break: break-all; }
      .code { color: #a1a1a6; }
      a.btn { display: inline-block; margin-top: 8px; padding: 12px 20px; background: #fff; color: #000; text-decoration: none; font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 2px; }
      a.btn:focus-visible { outline: 2px solid #b18cff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">NODE</p>
      <h1 id="title">Page not loaded</h1>
      <p id="why"></p>
      <p class="url" id="url"></p>
      <p class="code" id="code"></p>
      <a class="btn" id="retry" href="#">Try again</a>
    </div>
    <script>
      // Shown by NODE when a page fails to load or its tab crashes.
      const q = new URLSearchParams(location.search);
      const u = q.get("u") || "";
      const kind = q.get("kind") || "load";
      const desc = q.get("desc") || "";
      const reasons = {
        ERR_INTERNET_DISCONNECTED: "This computer is not connected to the internet.",
        ERR_NAME_NOT_RESOLVED: "The site's address could not be found. Check the spelling.",
        ERR_CONNECTION_REFUSED: "The site refused the connection.",
        ERR_CONNECTION_TIMED_OUT: "The site took too long to answer.",
        ERR_TIMED_OUT: "The site took too long to answer.",
        ERR_CONNECTION_RESET: "The connection was interrupted.",
        ERR_CERT_AUTHORITY_INVALID: "The site's security certificate is not trusted, so NODE did not open it.",
        ERR_CERT_DATE_INVALID: "The site's security certificate has expired, so NODE did not open it.",
        ERR_CERT_COMMON_NAME_INVALID: "The site's security certificate is for a different address, so NODE did not open it.",
        ERR_SSL_PROTOCOL_ERROR: "The site sent an invalid secure response.",
        ERR_BLOCKED_BY_CLIENT: "This address was blocked by NODE's ad and tracker blocking.",
        ERR_TOO_MANY_REDIRECTS: "The site keeps redirecting in a loop.",
      };
      if (kind === "crash") {
        document.title = "Page stopped";
        document.getElementById("title").textContent = "This page stopped";
        document.getElementById("why").textContent = "The page used too much memory or ran into an error, so it was closed. Your other tabs are fine.";
      } else {
        document.title = "Page not loaded";
        document.getElementById("why").textContent = reasons[desc] || "The page could not be loaded.";
      }
      if (/^https?:\/\//i.test(u)) {
        document.getElementById("url").textContent = u;
        document.getElementById("retry").href = u;
      } else {
        document.getElementById("retry").hidden = true;
      }
      if (desc) document.getElementById("code").textContent = desc;
    </script>
  </body>
</html>
