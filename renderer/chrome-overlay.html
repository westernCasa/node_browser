<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NODE sidebar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<!-- The sidebar over a page (B103): a copy of the window's sidebar in its own
     layer above the page, so it can slide in from the left edge without
     moving the page. renderer/app.js sends the copy; clicks and typing go back
     to the real sidebar. -->
<body class="chrome-overlay side">
  <div id="sprite" hidden></div>
  <nav class="sidebar" id="bar"></nav>
  <script src="chrome-overlay.js"></script>
</body>
</html>
