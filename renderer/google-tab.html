<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Google window</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6b6b70; --card: #fff; --line: #e2e2e0; --accent: #6d4aff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f2; --muted: #a0a0a6; --card: #212124; --line: #333336; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { max-width: 460px; margin: 16px; padding: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
      h1 { font-size: 19px; margin: 0 0 6px; }
      p { margin: 0 0 14px; color: var(--muted); }
      .url { font: 13px ui-monospace, Menlo, monospace; color: var(--fg); word-break: break-all; margin-bottom: 18px; }
      a.btn { display: inline-block; padding: 9px 16px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Open in the Google window</h1>
      <p>Google does not allow signing in inside NODE's engine, so Google account pages open in a separate browser window that NODE starts for you. Your sign-in stays there between sessions.</p>
      <div class="url" id="url"></div>
      <a class="btn" id="show" href="#">Show in Google window</a>
    </div>
    <script>
      const u = new URLSearchParams(location.search).get("u") || "";
      if (/^https?:\/\//i.test(u)) {
        document.getElementById("url").textContent = u;
        // NODE catches this link and brings the page to the front in the Google window.
        document.getElementById("show").href = u;
        try {
          document.title = "Google · " + new URL(u).hostname;
        } catch (_) {}
      }
    </script>
  </body>
</html>
