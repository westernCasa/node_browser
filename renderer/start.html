<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:" />
    <title>New tab</title>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 400; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 600; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      :root { --surface: #000; --raised: #0e0e0f; --line: #2a2a2d; --ink: #fff; --muted: #a1a1a6; --signal: #b18cff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--surface); color: var(--ink); font: 16px/24px "Barlow", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 14vh 24px 40px; }
      .mark { width: 44px; height: 44px; fill: var(--ink); }
      .eyebrow { margin: 18px 0 4px; font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0 0 28px; font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      form { width: min(640px, 100%); display: flex; border: 1px solid var(--line); border-radius: 2px; }
      input { flex: 1; min-width: 0; background: var(--raised); color: var(--ink); border: 0; padding: 14px 16px; font: 16px "Barlow", sans-serif; outline: none; }
      form:focus-within { border-color: var(--signal); }
      button { background: var(--ink); color: var(--surface); border: 0; padding: 0 20px; font: 600 12px "Barlow", sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
      .label { width: min(640px, 100%); margin: 40px 0 10px; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
      .tiles { width: min(640px, 100%); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .tile { position: relative; }
      .tile .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; background: var(--surface); color: var(--muted); border: 1px solid var(--line); font: 14px/20px "Barlow", sans-serif; letter-spacing: 0; opacity: 0; }
      .tile:hover .x, .tile .x:focus-visible { opacity: 1; }
      .tile .x:hover { color: var(--ink); border-color: var(--ink); }
      .tiles a { display: block; padding: 12px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-height: 72px; overflow: hidden; }
      .tiles a:hover, .tiles a:focus-visible { border-color: var(--ink); outline: none; }
      .tiles b { display: block; font-size: 14px; line-height: 18px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .tiles span { display: block; margin-top: 6px; font: 11px/14px "JetBrains Mono", monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .empty { width: min(640px, 100%); color: var(--muted); font-size: 14px; }
      @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 28px; line-height: 32px; } }
      /* Beta survey (B98): part of the start page, under the search box, once
         NODE has been used on 3 days. Not a pop-up: nothing is covered and the
         search box keeps the focus. */
      .survey[hidden] { display: none; }
      .survey { width: min(640px, 100%); margin: 24px 0 0; padding: 16px; border: 1px solid var(--line); border-left: 2px solid var(--signal); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .survey .text { flex: 1 1 320px; min-width: 0; }
      .survey .eyebrow { margin: 0 0 4px; color: var(--signal); font-size: 12px; letter-spacing: .12em; }
      .survey h2 { margin: 0 0 2px; font-size: 16px; line-height: 22px; font-weight: 600; }
      .survey p { margin: 0; color: var(--muted); font-size: 14px; line-height: 20px; }
      .survey .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .survey .row button { height: 36px; border-radius: 2px; }
      .survey .row .quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .survey .row .quiet:hover { border-color: var(--ink); }
      .survey .row .link { background: transparent; color: var(--muted); padding: 0 4px; letter-spacing: .08em; }
      .survey .row .link:hover { color: var(--ink); }
      .survey button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="22.8 -0.2 24 24" aria-hidden="true"><path transform="matrix(1.20193,0,0,1.20193,22.7763,-2.42319)" d="M10.004,12.998L1.067,12.998C1.035,12.67 1.018,12.337 1.018,12C1.018,11.663 1.035,11.33 1.067,11.002L8.593,11.002L3.273,5.682C3.696,5.166 4.169,4.693 4.684,4.271L10.004,9.591L10.004,2.065C10.332,2.033 10.665,2.016 11.002,2.016C11.339,2.016 11.672,2.033 12,2.065L12,11.002L20.937,11.002C20.969,11.33 20.986,11.663 20.986,12C20.986,12.337 20.969,12.67 20.937,12.998L13.411,12.998L18.731,18.318C18.309,18.834 17.836,19.307 17.32,19.729L12,14.409L12,21.935C11.672,21.967 11.339,21.984 11.002,21.984C10.665,21.984 10.332,21.967 10.004,21.935L10.004,12.998Z"/></svg>
    <p class="eyebrow">Research browser</p>
    <h1>What are you looking into?</h1>
    <form id="f" action="#">
      <input id="q" autocomplete="off" placeholder="Search Brave or type an address" aria-label="Search or address" />
      <button type="submit">Go</button>
    </form>
    <section class="survey" id="survey" aria-labelledby="sv-title" hidden>
      <div class="text">
        <p class="eyebrow">Beta survey</p>
        <h2 id="sv-title">Help decide what NODE fixes next</h2>
        <p id="sv-text"></p>
      </div>
      <div class="row">
        <button type="button" data-act="take">Take survey</button>
        <button type="button" class="quiet" data-act="later">Later</button>
        <button type="button" class="link" data-act="never">Don't ask again</button>
      </div>
    </section>
    <p class="label" id="top-label">Most visited</p>
    <div class="tiles" id="tiles"></div>
    <script>
      // NODE's new tab page. NODE passes the most visited pages in ?top= (JSON).
      let topSites = [];
      try {
        topSites = JSON.parse(new URLSearchParams(location.search).get("top") || "[]");
      } catch (_) {}
      const tiles = document.getElementById("tiles");
      for (const t of topSites.slice(0, 8)) {
        if (!/^https?:\/\//i.test(t.url || "")) continue;
        const a = document.createElement("a");
        a.href = t.url;
        const b = document.createElement("b");
        b.textContent = t.title || t.url;
        const s = document.createElement("span");
        try { s.textContent = new URL(t.url).hostname.replace(/^www\./, ""); } catch (_) {}
        a.append(b, s);
        // × removes the page from history, and so from this page (NODE handles it).
        const x = document.createElement("button");
        x.className = "x";
        x.type = "button";
        x.textContent = "×";
        x.title = "Remove from most visited";
        x.setAttribute("aria-label", "Remove " + (t.title || t.url) + " from most visited");
        x.addEventListener("click", () => {
          location.href = location.pathname + "?remove=" + encodeURIComponent(t.url);
        });
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.append(a, x);
        tiles.appendChild(tile);
      }
      if (!tiles.children.length) {
        document.getElementById("top-label").textContent = "Start here";
        tiles.outerHTML = '<p class="empty">Read any page and NODE suggests what to read next in the sidebar. Pages you visit often will show up here.</p>';
      }
      document.getElementById("f").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = document.getElementById("q").value.trim();
        if (!v) return;
        const looksLikeAddress = /^https?:\/\//i.test(v) || (/^[^\s]+\.[a-z]{2,}(\/|$)/i.test(v) && !/\s/.test(v));
        location.href = looksLikeAddress ? (/^https?:/i.test(v) ? v : "https://" + v) : "https://search.brave.com/search?q=" + encodeURIComponent(v);
      });
      document.getElementById("q").focus();

      // Beta survey (B98). NODE adds ?survey=<days used> when it is time to ask.
      // The prompt is part of the page, under the search box: no overlay, and
      // the search box keeps the focus. Each button goes to ?survey-act=…,
      // which NODE handles: Take survey opens the survey in this tab; Later
      // and Don't ask again come back here without the prompt.
      const surveyDays = Number(new URLSearchParams(location.search).get("survey") || 0);
      if (surveyDays >= 3) {
        const box = document.getElementById("survey");
        document.getElementById("sv-text").textContent =
          "You've used NODE on " + surveyDays + " days. Would you answer a short survey? About 4 minutes, anonymous.";
        box.querySelectorAll("button[data-act]").forEach((b) => b.addEventListener("click", () => { location.href = location.pathname + "?survey-act=" + b.dataset.act; }));
        box.hidden = false;
      }
    </script>
  </body>
</html>
